services:

  # ── PostgreSQL database ──────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine           # Official Postgres image (alpine = very small)
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persist data in a named volume
    environment:
      POSTGRES_DB: ${DB_NAME:-takhtit_db}
      POSTGRES_USER: ${DB_USER:-takhtit_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-takhtit_user} -d ${DB_NAME:-takhtit_db}"]
      interval: 5s
      retries: 5

  # ── Django application ───────────────────────────────────────────────────────
  web:
    build: .                            # Build image from the Dockerfile in current dir
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn takhtit.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app                          # Mount source code so changes reflect without rebuild
    ports:
      - "8000:8000"                     # Map container port 8000 → host port 8000
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-True}
      DB_NAME: ${DB_NAME:-takhtit_db}
      DB_USER: ${DB_USER:-takhtit_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db                       # <-- this is the service name above, NOT localhost!
      DB_PORT: "5432"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      db:
        condition: service_healthy      # Wait for postgres healthcheck to pass before starting

# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
  postgres_data:
